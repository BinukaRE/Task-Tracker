<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Obsidian Base Gradient -->
    <linearGradient id="obsidianBg" x1="120" y1="80" x2="904" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E2330" />
      <stop offset="25%" stop-color="#111622" />
      <stop offset="70%" stop-color="#0A0D14" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>

    <!-- Frosted Glass Gradient -->
    <linearGradient id="frostedGlass" x1="200" y1="200" x2="824" y2="824" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.01" />
    </linearGradient>

    <!-- Electric Cyan to Ice White Flow Gradient -->
    <linearGradient id="flowGlow" x1="280" y1="620" x2="740" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Subtle Rim Gradient -->
    <linearGradient id="rimStroke" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Specular Highlight for Checkmark -->
    <linearGradient id="checkGlow" x1="320" y1="520" x2="720" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="squircleShadow" x="0" y="40" width="1024" height="984" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="32" stdDeviation="40" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Inner Glow -->
    <filter id="emblemGlow" x="200" y="200" width="624" height="624" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#06B6D4" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- macOS Big Sur Squircle Base -->
  <rect x="96" y="96" width="832" height="832" rx="192" fill="url(#obsidianBg)" filter="url(#squircleShadow)" />

  <!-- Outer Rim Stroke -->
  <rect x="97" y="97" width="830" height="830" rx="191" stroke="url(#rimStroke)" stroke-width="2.5" />

  <!-- Inner Subtle Bevel Stroke -->
  <rect x="100" y="100" width="824" height="824" rx="188" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5" />

  <!-- Minimalist Ambient Background Mesh / Radial Glow -->
  <circle cx="512" cy="460" r="280" fill="#0EA5E9" fill-opacity="0.05" filter="blur(60px)" />
  <circle cx="680" cy="380" r="180" fill="#6366F1" fill-opacity="0.06" filter="blur(50px)" />

  <!-- Geometric Calendar Grid Wireframe (Minimalist Floating Glass Card) -->
  <g opacity="0.85">
    <!-- Glass Plate -->
    <rect x="220" y="240" width="584" height="544" rx="44" fill="url(#frostedGlass)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5" />

    <!-- Calendar Top Header Separator -->
    <line x1="220" y1="340" x2="804" y2="340" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5" stroke-dasharray="6 6" />

    <!-- Calendar Binder Rings / Accent Dots -->
    <circle cx="320" cy="290" r="8" fill="#38BDF8" fill-opacity="0.8" />
    <circle cx="512" cy="290" r="8" fill="#818CF8" fill-opacity="0.8" />
    <circle cx="704" cy="290" r="8" fill="#C084FC" fill-opacity="0.8" />

    <!-- Subtle Minimalist Date Grid Matrix Lines -->
    <line x1="365" y1="360" x2="365" y2="760" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />
    <line x1="512" y1="360" x2="512" y2="760" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />
    <line x1="659" y1="360" x2="659" y2="760" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />

    <line x1="240" y1="460" x2="784" y2="460" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />
    <line x1="240" y1="560" x2="784" y2="560" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />
    <line x1="240" y1="660" x2="784" y2="660" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />
  </g>

  <!-- Flow Continuity Wave (Representing Time & Tasks Moving) -->
  <path d="M220 540 C 340 480, 420 620, 560 520 C 660 440, 720 510, 804 470" 
        stroke="url(#flowGlow)" 
        stroke-width="4" 
        stroke-opacity="0.4" 
        stroke-linecap="round" />

  <!-- Ultra-Minimalist Precision Checkmark (The Core Emblem) -->
  <g filter="url(#emblemGlow)">
    <!-- Checkmark Path -->
    <path d="M336 532 L 464 660 L 704 380" 
          stroke="url(#checkGlow)" 
          stroke-width="52" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Dynamic Precision Accent Spheres at Node Intersections -->
  <!-- Checkmark Terminus Node -->
  <circle cx="704" cy="380" r="16" fill="#FFFFFF" />
  <circle cx="704" cy="380" r="28" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6" />

  <!-- Checkmark Pivot Node -->
  <circle cx="464" cy="660" r="14" fill="#38BDF8" />

  <!-- Checkmark Origin Node -->
  <circle cx="336" cy="532" r="12" fill="#06B6D4" />
</svg>
