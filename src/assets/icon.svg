<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Frosted Glass Gradient for Floating Calendar -->
    <linearGradient id="floatingGlass" x1="160" y1="140" x2="864" y2="884" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="30%" stop-color="#4F46E5" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#1E1B4B" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glass Rim Border -->
    <linearGradient id="glassBorder" x1="160" y1="140" x2="864" y2="884" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="75%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Electric Cyan to Ice White Flow Gradient -->
    <linearGradient id="flowGlow" x1="240" y1="640" x2="780" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="checkGlow" x1="280" y1="560" x2="760" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="40%" stop-color="#60A5FA" />
      <stop offset="80%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Ambient Floating Drop Shadow for Mac UI -->
    <filter id="floatingShadow" x="80" y="80" width="864" height="864" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#0F172A" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#38BDF8" flood-opacity="0.25" />
    </filter>

    <!-- Checkmark Luminescence -->
    <filter id="checkmarkGlow" x="180" y="240" width="664" height="564" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#00F0FF" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#FFFFFF" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Group with Floating Drop Shadow (NO solid background) -->
  <g filter="url(#floatingShadow)">
    <!-- Floating Frosted Glass Calendar Card -->
    <rect x="140" y="140" width="744" height="744" rx="176" fill="url(#floatingGlass)" />
    <!-- Precision Glass Stroke -->
    <rect x="141" y="141" width="742" height="742" rx="175" stroke="url(#glassBorder)" stroke-width="3" />
    <rect x="145" y="145" width="734" height="734" rx="171" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />

    <!-- Calendar Top Header Accent Bar -->
    <path d="M141 280 L 883 280" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" />
    
    <!-- Calendar Binder Rings / Accent Dots -->
    <circle cx="280" cy="210" r="14" fill="#38BDF8" fill-opacity="0.9" />
    <circle cx="512" cy="210" r="14" fill="#818CF8" fill-opacity="0.9" />
    <circle cx="744" cy="210" r="14" fill="#C084FC" fill-opacity="0.9" />

    <!-- Subtle Minimalist Date Grid Matrix Lines -->
    <line x1="330" y1="310" x2="330" y2="820" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2" />
    <line x1="512" y1="310" x2="512" y2="820" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2" />
    <line x1="694" y1="310" x2="694" y2="820" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2" />

    <line x1="170" y1="440" x2="854" y2="440" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2" />
    <line x1="170" y1="570" x2="854" y2="570" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2" />
    <line x1="170" y1="700" x2="854" y2="700" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2" />

    <!-- Dynamic Flow Waves (Task Stream) -->
    <path d="M170 580 C 290 510, 410 670, 560 550 C 670 460, 750 540, 854 490" 
          stroke="url(#flowGlow)" 
          stroke-width="5" 
          stroke-opacity="0.5" 
          stroke-linecap="round" />
  </g>

  <!-- Glowing Checkmark Floating in Front with Transparency -->
  <g filter="url(#checkmarkGlow)">
    <path d="M310 536 L 454 680 L 734 360" 
          stroke="url(#checkGlow)" 
          stroke-width="64" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Precision Accent Spheres at Key Nodes -->
  <circle cx="734" cy="360" r="20" fill="#FFFFFF" />
  <circle cx="734" cy="360" r="32" stroke="#00F0FF" stroke-width="3" stroke-opacity="0.7" />
  <circle cx="454" cy="680" r="18" fill="#38BDF8" />
  <circle cx="310" cy="536" r="16" fill="#00F0FF" />
</svg>
