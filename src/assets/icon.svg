<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Solid Modern Rich Gradient (NO blur, NO washed-out transparency) -->
    <linearGradient id="solidBg" x1="92" y1="92" x2="932" y2="932" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="30%" stop-color="#171C38" />
      <stop offset="70%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Top Gloss Rim -->
    <linearGradient id="topGloss" x1="512" y1="92" x2="512" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Precision Chamfer Border -->
    <linearGradient id="rimBorder" x1="92" y1="92" x2="932" y2="932" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="65%" stop-color="#818CF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>

    <!-- Electric Cyan to White Checkmark Gradient -->
    <linearGradient id="checkGradient" x1="300" y1="680" x2="740" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="75%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Flow Wave Gradient -->
    <linearGradient id="waveGradient" x1="120" y1="580" x2="900" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Crisp Checkmark Glow (tight, sharp, not fuzzy) -->
    <filter id="crispGlow" x="200" y="240" width="624" height="540" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#00F0FF" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Clean Squircle with ZERO outer blur or fuzzy shadows -->
  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#solidBg)" />
  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#topGloss)" />
  <rect x="93" y="93" width="838" height="838" rx="187" stroke="url(#rimBorder)" stroke-width="3" />
  <rect x="96" y="96" width="832" height="832" rx="184" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Calendar Header Divider -->
  <line x1="93" y1="260" x2="931" y2="260" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" />

  <!-- Calendar Accent Status Dots (Cyan, Indigo, Purple) -->
  <circle cx="260" cy="180" r="16" fill="#00F0FF" />
  <circle cx="260" cy="180" r="22" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="3" />
  
  <circle cx="512" cy="180" r="16" fill="#6366F1" />
  <circle cx="512" cy="180" r="22" stroke="#6366F1" stroke-opacity="0.3" stroke-width="3" />

  <circle cx="764" cy="180" r="16" fill="#C084FC" />
  <circle cx="764" cy="180" r="22" stroke="#C084FC" stroke-opacity="0.3" stroke-width="3" />

  <!-- Calendar Matrix Grid Lines (Crisp geometric lines) -->
  <line x1="300" y1="280" x2="300" y2="860" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2" />
  <line x1="512" y1="280" x2="512" y2="860" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2" />
  <line x1="724" y1="280" x2="724" y2="860" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2" />

  <line x1="120" y1="430" x2="904" y2="430" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2" />
  <line x1="120" y1="580" x2="904" y2="580" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2" />
  <line x1="120" y1="730" x2="904" y2="730" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2" />

  <!-- Dynamic Task Flow Stream Wave -->
  <path d="M120 600 C 260 520, 390 700, 530 580 C 650 480, 770 560, 904 490"
        stroke="url(#waveGradient)"
        stroke-width="6"
        stroke-linecap="round" />

  <!-- Crisp Checkmark Floating Foreground -->
  <g filter="url(#crispGlow)">
    <path d="M310 540 L 454 684 L 734 354"
          stroke="url(#checkGradient)"
          stroke-width="68"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

  <!-- Specular Accent Highlights on Checkmark Endpoints -->
  <circle cx="734" cy="354" r="22" fill="#FFFFFF" />
  <circle cx="734" cy="354" r="34" stroke="#00F0FF" stroke-width="3" stroke-opacity="0.8" />
  <circle cx="454" cy="684" r="18" fill="#38BDF8" />
  <circle cx="310" cy="540" r="16" fill="#00F0FF" />
</svg>